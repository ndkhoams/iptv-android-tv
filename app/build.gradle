plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iptv.tvapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.iptv.tvapp"
        minSdk 21
        targetSdk 34
        versionCode 81
        versionName "2.1.23"

        multiDexEnabled false

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packaging {
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }

    signingConfigs {
        tvAppSign {
            storeFile file("tvapp.keystore")
            storePassword "tvapp123"
            keyAlias "tvapp"
            keyPassword "tvapp123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tvAppSign
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.tvAppSign
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Leanback support for Android TV
    implementation 'androidx.leanback:leanback:1.0.0'

    // Android Baseline Profiles for AOT compilation on Android TV
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'

    // ExoPlayer (Support Android 5.0+, API 21, HLS, DASH, RTSP, ClearKey DRM)
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OkHttp for downloading M3U playlists
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Glide for Channel Logos
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
