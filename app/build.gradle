plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iptv.tvapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.iptv.tvapp"
        minSdk 21
        targetSdk 34
        versionCode 26
        versionName "1.9.17"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Chỉ đóng gói kiến trúc ARM cho Android TV (armeabi-v7a cho Mi Box 3c/box 32-bit, arm64-v8a cho box 64-bit)
        // Loại bỏ hoàn toàn x86/x86_64 giúp giảm hơn 50MB dung lượng APK (từ ~97MB xuống còn ~45MB)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }

    signingConfigs {
        tvAppSign {
            storeFile file("tvapp.keystore")
            storePassword "tvapp123"
            keyAlias "tvapp"
            keyPassword "tvapp123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tvAppSign
        }
        release {
            signingConfig signingConfigs.tvAppSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Leanback support for Android TV
    implementation 'androidx.leanback:leanback:1.0.0'

    // LibVLC for deinterlacing live TV & IPTV (Khử hoàn toàn xé hình/răng cưa 1080i)
    implementation 'org.videolan.android:libvlc-all:3.5.1'

    // ExoPlayer (Support Android 5.0+, API 21)
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OkHttp for downloading M3U playlists
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Glide for Channel Logos
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
