<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Play Web - Trực tiếp Thể thao & IPTV</title>
    <!-- Hls.js library for streaming m3u8 on Smart TV / Web -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(18, 24, 38, 0.95);
            --bg-focus: #f97316;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ========== HEADER ========== */
        header {
            height: 52px;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ========== MAIN LAYOUT ========== */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Cột 1: Danh mục */
        .sidebar-categories {
            width: 220px;
            background: rgba(15, 23, 42, 0.7);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }

        .cat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        .cat-item.active {
            background: rgba(249, 115, 22, 0.15);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }

        .cat-item.focused {
            background: var(--bg-focus) !important;
            color: #fff !important;
            box-shadow: 0 0 14px var(--accent-glow);
            transform: scale(1.02);
        }

        /* Cột 2: Danh sách kênh / Trận đấu */
        .channel-list-container {
            width: 380px;
            background: rgba(11, 15, 25, 0.9);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .ch-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
            position: relative;
        }

        .ch-card.active {
            border-color: var(--accent);
            background: rgba(249, 115, 22, 0.08);
        }

        .ch-card.focused {
            background: var(--bg-focus) !important;
            color: #fff !important;
            border-color: #fff !important;
            box-shadow: 0 0 16px var(--accent-glow);
            transform: scale(1.02);
            z-index: 2;
        }

        .ch-card.focused .ch-meta,
        .ch-card.focused .ch-league {
            color: rgba(255, 255, 255, 0.85) !important;
        }

        .ch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .ch-time-badge {
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
        }

        .ch-league {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .ch-title {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 4px;
        }

        .ch-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-sub);
        }

        /* Cột 3: Trình phát Video Player */
        .player-viewport {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Thanh điều khiển nguồn phát (Sources Bar) */
        .player-bottom-panel {
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .match-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-title {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .source-tabs-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .source-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            outline: none;
            transition: all 0.15s ease;
        }

        .source-btn.active {
            background: rgba(249, 115, 22, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        .source-btn.focused {
            background: var(--bg-focus) !important;
            color: #fff !important;
            box-shadow: 0 0 10px var(--accent-glow);
            transform: scale(1.05);
        }

        /* OSD Overlay khi toàn màn hình */
        .video-wrapper.fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        .video-osd {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10000;
        }

        .video-osd.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Loading Spinner */
        .player-loader {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            z-index: 5;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer Hướng dẫn bấm phím */
        .footer-keys {
            height: 32px;
            background: #0b0f19;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            padding: 0 16px;
            font-size: 11px;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .key-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .key-tag {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1px 5px;
            border-radius: 4px;
            color: #f1f5f9;
            font-weight: 700;
        }

        /* Responsive điều chỉnh cho màn hình nhỏ / Điện thoại */
        @media (max-width: 900px) {
            body { overflow-y: auto; }
            .main-container { flex-direction: column; overflow: visible; }
            .sidebar-categories { width: 100%; flex-direction: row; overflow-x: auto; height: 50px; }
            .channel-list-container { width: 100%; height: 260px; }
            .player-viewport { height: 320px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="brand">
            <span class="logo-box">TV PLAY</span>
            <span class="app-title">Web Player</span>
        </div>
        <div class="header-status">
            <span><span class="live-dot"></span><span id="txtLiveStatus">Đang tải...</span></span>
            <span id="txtClock">00:00</span>
            <button id="btnFullscreenToggle" class="source-btn" style="padding: 4px 8px;" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="main-container">
        
        <!-- CỘT 1: DANH MỤC -->
        <div class="sidebar-categories" id="sidebarCategories" tabindex="1">
            <!-- Render động bằng JS -->
        </div>

        <!-- CỘT 2: DANH SÁCH KÊNH / TRẬN ĐẤU -->
        <div class="channel-list-container" id="channelListContainer" tabindex="2">
            <!-- Render động bằng JS -->
        </div>

        <!-- CỘT 3: TRÌNH PHÁT VIDEO -->
        <div class="player-viewport">
            <div class="video-wrapper" id="videoWrapper">
                <video id="videoPlayer" playsinline></video>
                <div class="player-loader" id="playerLoader">
                    <div class="spinner"></div>
                    <span id="txtLoaderStatus">Đang kết nối luồng phát...</span>
                </div>

                <!-- OSD Overlay khi toàn màn hình -->
                <div class="video-osd" id="videoOsd">
                    <span style="font-weight:800; color:var(--accent);">TV PLAY</span>
                    <span id="txtOsdTitle" style="font-weight:600;">Tên trận đấu</span>
                    <span id="txtOsdSource" style="font-size:12px; color:var(--text-sub);">Nguồn 1</span>
                </div>
            </div>

            <!-- THANH THÔNG TIN VÀ NGUỒN PHÁT DƯỚI VIDEO -->
            <div class="player-bottom-panel">
                <div class="match-info-bar">
                    <div class="current-title" id="txtCurrentMatch">Chưa chọn trận đấu</div>
                    <div id="txtCurrentSourceInfo" style="font-size:12px; color:var(--text-sub);">Chọn nguồn bên dưới</div>
                </div>
                <div class="source-tabs-container" id="sourceTabsContainer">
                    <!-- Danh sách nút chọn nguồn (BLV...) -->
                </div>
            </div>
        </div>

    </div>

    <!-- FOOTER HƯỚNG DẪN REMOTE -->
    <div class="footer-keys">
        <span class="key-hint"><span class="key-tag">▲ ▼ ◄ ►</span> Di chuyển</span>
        <span class="key-hint"><span class="key-tag">OK / Enter</span> Phát / Chọn</span>
        <span class="key-hint"><span class="key-tag">Back</span> Thoát Toàn màn hình</span>
        <span class="key-hint"><span class="key-tag">F</span> Bật / Tắt Toàn màn hình</span>
    </div>

    <script>
        /* ================= CẤU HÌNH DỮ LIỆU & TRẠNG THÁI ================= */
        var DATA_API_URL = "https://raw.githubusercontent.com/ndkhoams/iptv/main/thethao-data.json";
        
        var sportsData = null;
        var categories = [];
        var activeCategoryIndex = 0;
        var activeChannelIndex = 0;
        var activeSourceIndex = 0;

        // Trạng thái điều hướng D-Pad Smart TV:
        // 0: SIDEBAR (Danh mục), 1: CHANNELS (Danh sách kênh), 2: SOURCES (Nguồn phát), 3: PLAYER
        var currentZone = 1; 
        var focusedCategoryIndex = 0;
        var focusedChannelIndex = 0;
        var focusedSourceIndex = 0;

        var videoEl = document.getElementById('videoPlayer');
        var videoWrapper = document.getElementById('videoWrapper');
        var playerLoader = document.getElementById('playerLoader');
        var hlsInstance = null;
        var osdTimeout = null;

        /* ================= KHỞI TẠO ĐỒNG HỒ & DỮ LIỆU ================= */
        function updateClock() {
            var now = new Date();
            var hh = String(now.getHours()).padStart(2, '0');
            var mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('txtClock').textContent = hh + ':' + mm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function loadData() {
            var url = DATA_API_URL + '?t=' + Date.now();
            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    return res.json();
                })
                .then(function(data) {
                    sportsData = data;
                    try {
                        buildCategories();
                        renderCategories();
                        renderChannels();
                        var curCat = categories[activeCategoryIndex];
                        if (curCat && curCat.channels && curCat.channels.length > 0) {
                            selectChannel(0, true);
                        }
                        var timeStr = data.updated_at ? data.updated_at.split(' ')[1] : '';
                        document.getElementById('txtLiveStatus').textContent = "Đã cập nhật (" + timeStr + ")";
                    } catch (e) {
                        console.error("Lỗi giao diện:", e);
                        document.getElementById('txtLiveStatus').textContent = "Lỗi hiển thị: " + e.message;
                    }
                })
                .catch(function(err) {
                    console.error("Lỗi tải data:", err);
                    document.getElementById('txtLiveStatus').textContent = "Lỗi nạp dữ liệu!";
                });
        }

        function buildCategories() {
            categories = [];
            if (sportsData.live_events && sportsData.live_events.length > 0) {
                categories.push({
                    name: "🔴 LIVE EVENTS",
                    type: "LIVE_EVENTS",
                    channels: sportsData.live_events
                });
            }
            if (sportsData.source_groups) {
                sportsData.source_groups.forEach(function(sg) {
                    categories.push({
                        name: sg.name,
                        type: "SOURCE_GROUP",
                        channels: sg.channels
                    });
                });
            }
        }

        /* ================= RENDER GIAO DIỆN ================= */
        function updateCategoriesHighlight() {
            var items = document.querySelectorAll('#sidebarCategories .cat-item');
            items.forEach(function(item, idx) {
                if (idx === activeCategoryIndex) item.classList.add('active');
                else item.classList.remove('active');

                if (currentZone === 0 && idx === focusedCategoryIndex) item.classList.add('focused');
                else item.classList.remove('focused');
            });
            scrollFocusedIntoView();
        }

        function renderCategories() {
            var container = document.getElementById('sidebarCategories');
            container.innerHTML = '';
            categories.forEach(function(cat, idx) {
                var div = document.createElement('div');
                div.className = 'cat-item' + (idx === activeCategoryIndex ? ' active' : '') + (currentZone === 0 && idx === focusedCategoryIndex ? ' focused' : '');
                div.innerHTML = '<span>' + cat.name + '</span>';
                div.onclick = function() {
                    switchCategory(idx);
                };
                container.appendChild(div);
            });
            scrollFocusedIntoView();
        }

        function switchCategory(idx) {
            activeCategoryIndex = idx;
            focusedCategoryIndex = idx;
            activeChannelIndex = 0;
            focusedChannelIndex = 0;
            updateCategoriesHighlight();
            renderChannels();
            var curCat = categories[activeCategoryIndex];
            if (curCat && curCat.channels && curCat.channels.length > 0) {
                selectChannel(0, true);
            }
        }

        function updateChannelHighlight() {
            var cards = document.querySelectorAll('#channelListContainer .ch-card');
            cards.forEach(function(card, idx) {
                if (idx === activeChannelIndex) card.classList.add('active');
                else card.classList.remove('active');

                if (currentZone === 1 && idx === focusedChannelIndex) card.classList.add('focused');
                else card.classList.remove('focused');
            });
            scrollFocusedIntoView();
        }

        function renderChannels() {
            var container = document.getElementById('channelListContainer');
            container.innerHTML = '';
            var curCat = categories[activeCategoryIndex];
            if (!curCat || !curCat.channels || curCat.channels.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--text-sub); text-align:center;">Không có kênh nào</div>';
                return;
            }

            curCat.channels.forEach(function(ch, idx) {
                var card = document.createElement('div');
                card.className = 'ch-card' + (idx === activeChannelIndex ? ' active' : '') + (currentZone === 1 && idx === focusedChannelIndex ? ' focused' : '');
                
                var title = ch.displayTitle || ch.name || '';
                var timeBadge = ch.time ? (ch.time + (ch.date ? ' ' + ch.date : '')) : '';
                var leagueBadge = ch.leagueName || '';
                var sourceCount = (ch.sources && ch.sources.length) ? (ch.sources.length + ' nguồn') : '1 nguồn';

                card.innerHTML = 
                    '<div class="ch-header">' +
                        (timeBadge ? '<span class="ch-time-badge">' + timeBadge + '</span>' : '<span></span>') +
                        '<span class="ch-league">' + leagueBadge + '</span>' +
                    '</div>' +
                    '<div class="ch-title">' + title + '</div>' +
                    '<div class="ch-meta">' +
                        '<span>' + (ch.homeTeam ? (ch.homeTeam + ' vs ' + ch.awayTeam) : '') + '</span>' +
                        '<span>' + sourceCount + '</span>' +
                    '</div>';

                card.onclick = function() {
                    selectChannel(idx, true);
                };
                container.appendChild(card);
            });
            scrollFocusedIntoView();
        }

        function selectChannel(idx, autoPlay) {
            if (autoPlay === undefined) autoPlay = true;
            activeChannelIndex = idx;
            focusedChannelIndex = idx;
            activeSourceIndex = 0;
            focusedSourceIndex = 0;
            updateChannelHighlight();

            var curCat = categories[activeCategoryIndex];
            if (!curCat || !curCat.channels) return;
            var ch = curCat.channels[idx];
            if (!ch) return;

            document.getElementById('txtCurrentMatch').textContent = ch.displayTitle || ch.name || '';
            renderSources(ch);
            if (autoPlay) {
                playCurrentSource(ch);
            }
        }

        function updateSourceHighlight() {
            var btns = document.querySelectorAll('#sourceTabsContainer .source-btn');
            btns.forEach(function(btn, idx) {
                if (idx === activeSourceIndex) btn.classList.add('active');
                else btn.classList.remove('active');

                if (currentZone === 2 && idx === focusedSourceIndex) btn.classList.add('focused');
                else btn.classList.remove('focused');
            });
            scrollFocusedIntoView();
        }

        function renderSources(ch) {
            var container = document.getElementById('sourceTabsContainer');
            container.innerHTML = '';
            var sources = ch.sources || [{ name: "Nguồn chính", url: ch.url }];

            sources.forEach(function(s, sIdx) {
                var btn = document.createElement('button');
                btn.className = 'source-btn' + (sIdx === activeSourceIndex ? ' active' : '') + (currentZone === 2 && sIdx === focusedSourceIndex ? ' focused' : '');
                btn.textContent = s.name || ('Nguồn ' + (sIdx + 1));
                btn.onclick = function() {
                    activeSourceIndex = sIdx;
                    focusedSourceIndex = sIdx;
                    updateSourceHighlight();
                    playCurrentSource(ch);
                };
                container.appendChild(btn);
            });
        }

        /* ================= PHÁT VIDEO BẰNG HLS.JS / HTML5 ================= */
        function playCurrentSource(ch) {
            var sources = ch.sources || [{ name: "Nguồn chính", url: ch.url }];
            var s = sources[activeSourceIndex] || sources[0];
            if (!s || !s.url) return;

            var playUrl = s.url;
            document.getElementById('txtCurrentSourceInfo').textContent = s.name || 'Đang phát';
            showOSD(ch.displayTitle || ch.name, s.name || 'Nguồn phát');

            playerLoader.style.display = 'flex';
            document.getElementById('txtLoaderStatus').textContent = 'Đang tải luồng...';

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 60
                });
                hlsInstance.loadSource(playUrl);
                hlsInstance.attachMedia(videoEl);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoEl.play().catch(function(e) { console.log("Cần bấm phím để phát:", e); });
                    playerLoader.style.display = 'none';
                });
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                document.getElementById('txtLoaderStatus').textContent = 'Lỗi mạng, thử lại...';
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                document.getElementById('txtLoaderStatus').textContent = 'Lỗi giải mã, phục hồi...';
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                playerLoader.style.display = 'none';
                                hlsInstance.destroy();
                                break;
                        }
                    }
                });
            } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                // Hỗ trợ native HLS trên Safari / WebKit TV
                videoEl.src = playUrl;
                videoEl.addEventListener('loadedmetadata', function() {
                    videoEl.play();
                    playerLoader.style.display = 'none';
                });
            } else {
                videoEl.src = playUrl;
                videoEl.play();
            }

            videoEl.onplaying = function() {
                playerLoader.style.display = 'none';
            };
            videoEl.onerror = function() {
                playerLoader.style.display = 'none';
                document.getElementById('txtCurrentSourceInfo').textContent = 'Lỗi tải luồng phát';
            };
        }

        /* ================= HIỂN THỊ OSD & TOÀN MÀN HÌNH ================= */
        function showOSD(title, source) {
            var osd = document.getElementById('videoOsd');
            document.getElementById('txtOsdTitle').textContent = title;
            document.getElementById('txtOsdSource').textContent = source;
            osd.classList.add('show');
            clearTimeout(osdTimeout);
            osdTimeout = setTimeout(function() {
                osd.classList.remove('show');
            }, 4000);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoWrapper.requestFullscreen().catch(function(err) {
                    console.log("Lỗi full screen:", err);
                });
                videoWrapper.classList.add('fullscreen-mode');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                videoWrapper.classList.remove('fullscreen-mode');
            }
        }

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                videoWrapper.classList.remove('fullscreen-mode');
            } else {
                videoWrapper.classList.add('fullscreen-mode');
                showOSD(document.getElementById('txtCurrentMatch').textContent, '');
            }
        });

        /* ================= ĐIỀU HƯỚNG BẰNG REMOTE SMART TV (D-PAD) ================= */
        function scrollFocusedIntoView() {
            var focused = document.querySelector('.focused');
            if (focused) {
                focused.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
            }
        }

        window.addEventListener('keydown', function(e) {
            var keyCode = e.keyCode || e.which;
            
            // Xử lý các phím Tizen Return (10009), Escape (27), Backspace (8)
            if (keyCode === 10009 || keyCode === 27 || keyCode === 8) {
                if (document.fullscreenElement) {
                    toggleFullscreen();
                    e.preventDefault();
                    return;
                }
                if (currentZone > 0) {
                    currentZone = 0;
                    renderCategories();
                    renderChannels();
                    e.preventDefault();
                    return;
                }
            }

            // Phím F: Toàn màn hình
            if (keyCode === 70) { // 'F'
                toggleFullscreen();
                e.preventDefault();
                return;
            }

            // D-Pad Navigation
            switch (keyCode) {
                case 38: // ARROW UP
                    handleKeyUp();
                    e.preventDefault();
                    break;
                case 40: // ARROW DOWN
                    handleKeyDown();
                    e.preventDefault();
                    break;
                case 37: // ARROW LEFT
                    handleKeyLeft();
                    e.preventDefault();
                    break;
                case 39: // ARROW RIGHT
                    handleKeyRight();
                    e.preventDefault();
                    break;
                case 13: // ENTER / OK
                    handleKeyEnter();
                    e.preventDefault();
                    break;
                case 415: // Media Play
                    videoEl.play();
                    break;
                case 19: // Media Pause
                    videoEl.pause();
                    break;
            }
        });

        function handleKeyUp() {
            if (document.fullscreenElement) {
                // Khi toàn màn hình, Up = kênh trước đó
                var curCat = categories[activeCategoryIndex];
                if (curCat && curCat.channels && activeChannelIndex > 0) {
                    selectChannel(activeChannelIndex - 1, true);
                }
                return;
            }
            if (currentZone === 0) {
                if (focusedCategoryIndex > 0) {
                    focusedCategoryIndex--;
                    updateCategoriesHighlight();
                }
            } else if (currentZone === 1) {
                if (focusedChannelIndex > 0) {
                    focusedChannelIndex--;
                    updateChannelHighlight();
                }
            }
        }

        function handleKeyDown() {
            if (document.fullscreenElement) {
                // Khi toàn màn hình, Down = kênh tiếp theo
                var curCat = categories[activeCategoryIndex];
                if (curCat && curCat.channels && activeChannelIndex < curCat.channels.length - 1) {
                    selectChannel(activeChannelIndex + 1, true);
                }
                return;
            }
            if (currentZone === 0) {
                if (focusedCategoryIndex < categories.length - 1) {
                    focusedCategoryIndex++;
                    updateCategoriesHighlight();
                }
            } else if (currentZone === 1) {
                var curCat = categories[activeCategoryIndex];
                if (curCat && curCat.channels && focusedChannelIndex < curCat.channels.length - 1) {
                    focusedChannelIndex++;
                    updateChannelHighlight();
                }
            }
        }

        function handleKeyLeft() {
            if (document.fullscreenElement) return;
            if (currentZone === 1) {
                currentZone = 0;
                focusedCategoryIndex = activeCategoryIndex;
                updateCategoriesHighlight();
                updateChannelHighlight();
            } else if (currentZone === 2) {
                if (focusedSourceIndex > 0) {
                    focusedSourceIndex--;
                    updateSourceHighlight();
                } else {
                    currentZone = 1;
                    updateChannelHighlight();
                    updateSourceHighlight();
                }
            }
        }

        function handleKeyRight() {
            if (document.fullscreenElement) return;
            if (currentZone === 0) {
                currentZone = 1;
                focusedChannelIndex = activeChannelIndex;
                updateCategoriesHighlight();
                updateChannelHighlight();
            } else if (currentZone === 1) {
                currentZone = 2;
                focusedSourceIndex = activeSourceIndex;
                updateChannelHighlight();
                updateSourceHighlight();
            } else if (currentZone === 2) {
                var curCat = categories[activeCategoryIndex];
                if (curCat && curCat.channels) {
                    var ch = curCat.channels[activeChannelIndex];
                    var sources = (ch && ch.sources) ? ch.sources : [];
                    if (focusedSourceIndex < sources.length - 1) {
                        focusedSourceIndex++;
                        updateSourceHighlight();
                    }
                }
            }
        }

        function handleKeyEnter() {
            if (document.fullscreenElement) {
                showOSD(document.getElementById('txtCurrentMatch').textContent, '');
                return;
            }
            if (currentZone === 0) {
                switchCategory(focusedCategoryIndex);
                currentZone = 1;
            } else if (currentZone === 1) {
                selectChannel(focusedChannelIndex, true);
            } else if (currentZone === 2) {
                var curCat = categories[activeCategoryIndex];
                if (curCat && curCat.channels) {
                    var ch = curCat.channels[activeChannelIndex];
                    activeSourceIndex = focusedSourceIndex;
                    updateSourceHighlight();
                    playCurrentSource(ch);
                }
            }
        }

        // Bắt đầu nạp dữ liệu khi tải trang
        loadData();
        // Tự động làm mới dữ liệu sau mỗi 5 phút
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
