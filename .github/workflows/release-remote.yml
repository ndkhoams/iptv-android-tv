# CI/CD Workflow for TV Remote
name: Build & Release TV Remote (Phone App)

on:
  push:
    branches: [ main ]
    paths:
      - 'remote/**'
      - '.github/workflows/release-remote.yml'
    tags:
      - 'remote-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-remote:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build TV Remote Debug APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
      run: |
        ./gradlew :remote:assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        
        FOUND_APK=0
        for f in remote/build/outputs/apk/debug/*.apk; do
          if [ -f "$f" ]; then
            cp "$f" "remote/build/outputs/apk/debug/TV Remote.apk"
            FOUND_APK=1
            break
          fi
        done
        if [ $FOUND_APK -eq 0 ]; then
          echo "FAIL: TV Remote APK was not generated"
          exit 1
        fi

    - name: Upload TV Remote APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Remote-debug
        path: "remote/build/outputs/apk/debug/TV Remote.apk"

    - name: Publish Official TV Remote Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/remote-v')
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - TV Remote"
        body: |
          ### Bản phát hành ${{ github.ref_name }}:
          - Ứng dụng điều khiển TV Samsung / Android TV trên điện thoại: **TV Remote.apk** (v1.1.5)
          - Bổ sung nút "Xong" (kết thúc nhận diện sớm) trong hộp thoại tìm kiếm giọng nói.
          - Bổ sung tính năng hủy ghép đôi và xóa TV đã lưu trong cài đặt thiết bị.
          - Tối ưu hóa phản hồi nút bấm, giao diện cân đối và kết nối ổn định.
        files: |
          remote/build/outputs/apk/debug/TV Remote.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
