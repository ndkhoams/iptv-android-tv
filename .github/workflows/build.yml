name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.0' }}
        name: v1.9.0 - Logo TV mới, Banner thẻ dài, Sửa tương phản & Viền EPG, Ưu tiên FHD 1080
        body: |
          ### Bản cập nhật v1.9.0 cho TV Play Android TV:
          - **Thiết kế lại Logo & Icon App:** Ở giữa màn hình TV là chữ **TV** màu trắng đậm nét trên khung viền cam FPT và nền Dark Navy sang trọng; loại bỏ nút tam giác play cũ.
          - **Bổ sung Banner dạng thẻ dài (Android TV Leanback Launcher):** Cung cấp banner tỉ lệ 16:9 (640x360 px) với logo TV, thương hiệu TV Play IPTV và dải phụ đề "TRUYỀN HÌNH TRỰC TUYẾN • FULL HD" bắt mắt.
          - **Sửa tương phản chữ trong Danh sách phát nhanh:** Ô được highlight chuyển sang chữ đen than `#111827` trên nền trắng sáng, rõ nét và dễ nhìn.
          - **Sửa viền box Lịch phát sóng (EPG):** Loại bỏ giãn ngang gây tràn khung, thêm margin an toàn và vô hiệu hóa clip layout giúp viền bo cam hiển thị trọn vẹn 100% hai bên trái phải.
          - **Ưu tiên nhãn FHD 1080:** Các kênh HD phát sóng tại Việt Nam (VTV, HTV, FPT, v.v.) hiển thị chuẩn **FHD 1080** (nhãn rút gọn **FHD** trong danh sách), tách biệt rõ ràng với luồng 720p.
          - **Thẻ tên chương trình 10s & hiển thị khi Back về:** Tăng thời lượng hiển thị thẻ OSD góc trái lên 10 giây; mỗi khi nhấn Quay lại (Back) từ Cài đặt, Danh sách kênh hay Playlist nhanh về toàn màn hình đều tự động hiện thẻ thông tin kênh và chương trình đang phát.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
