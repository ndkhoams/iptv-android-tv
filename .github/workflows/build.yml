name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Trực tiếp Thể Thao (Chuối Chiên, Gà Vàng, Xôi Lạc, Cà Khịa) & KTV Playlist"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tích hợp toàn diện 5 nguồn thể thao trực tiếp theo thời gian thực:**
            - 🍌 **Chuối Chiên TV**: Kết nối trực tiếp API Chuối Chiên lấy toàn bộ các trận đấu bóng đá hôm nay, đầy đủ các BLV (Chuối Tây, Chuối Chao, Chuối Nhỏ, Chuối Già...), tự động nạp luồng FHD/HD với Referer chuẩn (`https://live.chuoichien.tv/`).
            - 🐔 **Gà Vàng & Tiếu Lâm**: Lấy lịch thi đấu và luồng phát kèm tên BLV (Gà Siêu Son, Gà Siêu Mõm, Gà Tiếu Lâm...) qua API hệ sinh thái Gà Vàng.
            - 🍚 **Xôi Lạc TV** & 🌶️ **Cà Khịa TV**: Cào lịch đấu thời gian thực và giải mã luồng m3u8 động siêu tốc khi bấm chọn trận.
            - Tự động gộp thành nhóm **`⚽ TRỰC TIẾP BÓNG ĐÁ (HÔM NAY)`** cùng các nhóm riêng từng đài đặt ngay trên đầu danh mục kênh.
          - **Nâng cấp Player Engine (LibVLC & ExoPlayer):**
            - Hỗ trợ định dạng link kèm header (`url|Referer=...&User-Agent=...`).
            - Tự động truyền đúng `:http-referrer` và `:http-user-agent` cho LibVLC cũng như `DefaultHttpDataSource` cho ExoPlayer, giải quyết triệt để lỗi HTTP 403 Forbidden.
          - **Đại tu toàn bộ kênh truyền hình nội địa & quốc tế (100% hoạt động):**
            - VTV (VTV1-VTV10), HTV (HTV1, 2, 3, 7, 9, HTV Thể Thao), HTVC, THVL1, THVL2 và SCTV (1 đến 22).
            - Loại bỏ nhóm `LIVE EVENTS 🔴` chứa phim lẻ gây hiểu nhầm.
          - **Cập nhật Playlist mặc định & Cài đặt máy chủ:**
            - Cập nhật link playlist online mặc định sang KTV: `https://raw.githubusercontent.com/ndkhoams/iptv/refs/heads/main/ktv.m3u`.
            - Mặc định để trống máy chủ UDPXY.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
