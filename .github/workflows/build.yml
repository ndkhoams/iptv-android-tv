name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.9' }}
        name: v1.9.9 - Khắc Phục Lỗi Văng App (Crash) Khi Mở, Tối Ưu Quản Lý Bề Mặt Vẽ LibVLC
        body: |
          ### Bản cập nhật vá khẩn cấp v1.9.9 cho TV Play Android TV:
          - **Khắc phục triệt để lỗi văng app khi khởi động:**
            - Triệt tiêu lỗi `IllegalStateException: already attached` do `attachViews()` bị gọi lặp lại trong cả `onCreate` và `onStart`.
            - Bổ sung chốt kiểm tra an toàn `areViewsAttached()` và bọc `try-catch` toàn bộ các điểm gắn/nhả bề mặt vẽ LibVLC (`onStart`, `onStop`, `playWithVlc`, `onDestroy`).
            - Kiểm tra `!isFinishing && !isDestroyed` và trạng thái kênh trước khi resume stream.
          - **Giữ nguyên toàn bộ tính năng và bản sửa lỗi từ v1.9.8:**
            - Khắc phục lỗi đen màn hình vẫn có tiếng lúc mở app/thoát ra vào lại.
            - Bật bàn phím ảo tức thì khi bấm chọn ô Máy chủ udpxy bằng remote TV.
            - Khóa duy nhất 1 huy hiệu "Đang phát" trên Lịch phát sóng EPG, lọc sạch lịch cũ.
            - Khắc phục kẹt phím D-pad, Web Remote Kênh yêu thích, Thẻ Logo Dark Navy mới.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
