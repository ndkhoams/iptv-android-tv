name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.16 - Chuyển kênh siêu tốc, Triệt tiêu đơ hình kênh cũ & Đồng bộ âm thanh - hình ảnh"
        body: |
          ### Bản cập nhật v1.9.16 cho TV Play Android TV:
          - **Triệt tiêu 100% hiện tượng đứng hình kênh cũ khi chuyển kênh:**
            - Ngay khi bấm đổi kênh, layout video cũ được ẩn lập tức (`View.INVISIBLE`), trả lại nền đen tĩnh và spinner tải kênh. Người xem không bao giờ còn thấy khung hình đơ của kênh cũ.
            - Chỉ hiển thị video mới khi LibVLC giải mã xong khung hình đầu tiên (`Event.Vout`), khắc phục việc spinner bị tắt sớm do luồng âm thanh.
          - **Đồng bộ âm thanh và hình ảnh chuẩn Master Clock:**
            - Khôi phục cơ chế đồng bộ A/V chuẩn của VLC, loại bỏ hoàn toàn tình trạng âm thanh chạy trước vài giây trong khi hình ảnh chưa tải xong.
          - **Tối ưu bộ đệm chuyển kênh siêu tốc 300ms:**
            - Giảm `caching` từ 800ms xuống 300ms cho mạng nội bộ LAN / udpxy / multicast FPT, giúp bắt kênh nhanh hơn gấp đôi.
          - **Kế thừa các tính năng hoàn hảo từ v1.9.15:**
            - Thuật toán Deinterlace Yadif PC siêu nét, loại bỏ bóng ma và răng cưa 1080i.
            - Tùy chọn Deinterlace trực tiếp trong Menu Cài đặt (Yadif, Linear, Blend, Tắt).
            - OSD 3 dòng thông minh góc dưới màn hình.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
