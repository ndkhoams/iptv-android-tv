name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.12 - Đo độ phân giải video thực tế từ Decoder phần cứng"
        body: |
          ### Bản cập nhật v1.9.12 cho TV Play Android TV:
          - **Đo kích thước độ phân giải thực tế từ bộ giải mã phần cứng (Hardware Decoder):**
            - Chấm dứt triệt để tình trạng mọi kênh đều hiển thị cố định `1920x1080 @ 50fps`.
            - LibVLC: Tự động trích xuất thông số khung hình từ `IMedia.VideoTrack` và lắng nghe sự kiện `ESAdded` khi luồng video bắt đầu giải mã.
            - ExoPlayer: Kết hợp đọc kích thước chính xác từ `videoFormat` và `videoSize`.
            - Hiển thị đúng từng độ phân giải thực tế: `720x576 @ 50fps` (SD), `1280x720 @ 50fps` (HD), `1920x1080 @ 50fps` (FHD), `3840x2160 @ 50fps` (4K).
            - Trạng thái nhận diện trung thực trong khoảnh khắc đầu nạp luồng: `Đang nhận diện video... • --- Mbps`.
          - **Kế thừa các tính năng nổi bật từ v1.9.11:**
            - Đo bitrate thời gian thực qua TrafficStats của Linux Kernel.
            - Bố cục OSD góc dưới 3 dòng rõ ràng: Tên kênh/Logo, EPG đang phát (màu cam), và Thông số kỹ thuật (màu cyan).
            - Khóa tiêu điểm D-pad không mất focus, máy chủ udpxy không bị bàn phím che khuất.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
