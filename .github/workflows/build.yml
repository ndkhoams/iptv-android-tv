name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Điều Chỉnh User-Agent Phổ Thông & Hiển Thị Logo Ứng Dụng Trên Toast"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Điều chỉnh HTTP User Agent Mặc định về giá trị phổ thông:**
            - Đã chuyển sang chuẩn phổ thông Android / Chrome (`Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36`).
            - Loại bỏ hoàn toàn các thông số phần cứng cụ thể (ZTE, B866V2F, FPT Play), đảm bảo tính trung lập và tương thích tối đa với mọi máy chủ phát sóng.
          - **Sửa biểu tượng logo trên các dòng thông báo (Toast):**
            - Xuất và cấu hình đầy đủ bộ bitmap biểu tượng TV Play sắc nét cho cả định dạng vuông (`ic_launcher`) và tròn (`ic_launcher_round`) trên toàn bộ mật độ màn hình (`mdpi` đến `xxxhdpi`).
            - Cấu hình lại `AndroidManifest.xml` giúp hệ điều hành Android TV hiển thị chuẩn xác logo TV Play thay cho logo robot Android mặc định khi bật thông báo.
          - **Hoàn thiện trình cập nhật ứng dụng tự động trong app:**
            - Cơ chế kiểm tra cập nhật mới linh hoạt, tự động phát hiện bản phát hành mới nhất và hỗ trợ tải về cài đặt trực tiếp trên TV.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
