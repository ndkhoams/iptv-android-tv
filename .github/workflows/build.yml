name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Nút Thao Tác Nhanh Làm Mới Kênh & Tự Động Cập Nhật App Trong App"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tích hợp 2 nút thao tác nhanh trên thanh Menu bên trái (Sidebar):**
            - 🔄 **Nút làm mới danh sách kênh**: Xóa sạch cache và tải lại tức thì toàn bộ playlist M3U cùng các trận đấu thể thao trực tiếp mới nhất hôm nay.
            - 🚀 **Nút kiểm tra cập nhật ứng dụng (Check for update)**: Tự động chạy ẩn kiểm tra phiên bản mới mỗi lần mở app và hỗ trợ bấm kiểm tra thủ công. Tải về và cài đặt trực tiếp file APK ngay trong app.
          - **Nhóm Kênh Thể Thao Quốc Tế 24/7 (F1 & Tennis):**
            - Bổ sung nhóm chuyên mục `🌐 THỂ THAO QUỐC TẾ (F1 / TENNIS)` gồm các kênh 24/7 chất lượng cao: Sky Sport F1, Sky Sport Tennis, TNT Sports 1-4, Eurosport 1-2, Canal+ Sport.
          - **Tối ưu & ổn định toàn diện hệ thống thể thao:**
            - Đầy đủ các kênh bóng đá Việt Nam có BLV từ Chuối Chiên, Gà Vàng, Xôi Lạc và Cà Khịa.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
