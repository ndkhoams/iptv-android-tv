name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Khởi Động Siêu Nhanh, Quét Thể Thao Ngầm, Map Phím Ch+/Ch- & Thanh Thông Báo Mới"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tối ưu tốc độ mở app tức thì (< 1 giây):**
            - Không còn phải chờ quét luồng trực tiếp thể thao khi mở app. App đọc danh sách M3U từ bộ nhớ đệm và phát ngay kênh mặc định chỉ trong tích tắc.
          - **Tìm kiếm luồng trực tiếp thể thao chạy ngầm:**
            - Trong khi kênh TV đang phát mượt mà, app tự động quét ngầm các trận đấu thể thao hôm nay trên Internet và tự động gộp vào danh mục mà không làm gián đoạn việc xem TV.
          - **Thanh thông báo cạnh dưới màn hình chuyên dụng (Không hiện giữa):**
            - Thiết kế thanh thông báo kính mờ cao cấp ở cạnh dưới màn hình kèm logo TV Play sắc nét, thông báo hoàn tất quét thể thao và trạng thái ứng dụng.
          - **Map phím Channel + / Channel - trên điều khiển TV:**
            - Bấm phím **Ch +**: chuyển tới kênh có số thứ tự lớn hơn trong danh sách hiện hành.
            - Bấm phím **Ch -**: chuyển tới kênh có số thứ tự nhỏ hơn trong danh sách hiện hành.
            - Tự động cuộn và trỏ khung chọn tới kênh mới khi đang mở bảng hướng dẫn kênh.
          - **Cải tiến hộp thoại Cài đặt:**
            - Đổi nhãn nút thành "Mặc định", hỗ trợ phím điều hướng D-Pad di chuyển chuẩn xác giữa ô nhập User-Agent và nhóm lựa chọn chế độ mở kênh.
          - **Cố định kích thước hộp thoại chọn playlist nhanh:**
            - Khóa cố định tỉ lệ 1:1, không còn hiện tượng phóng to làm tràn dòng ra ngoài viewport màn hình TV.
          - **Bổ sung trọn bộ Adaptive Icon cho Android 8.0 đến Android 14:**
            - Đảm bảo toàn bộ thông báo hệ thống và giao diện hiển thị chuẩn logo TV Play.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
