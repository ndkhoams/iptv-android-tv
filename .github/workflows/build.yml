name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Đồng Bộ Trực Tiếp Thể Thao Từ GitHub thethao.m3u & Tối Ưu Siêu Nhẹ Cho TV"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Chuyển sang đồng bộ trực tiếp từ `thethao.m3u` trên GitHub:**
            - Loại bỏ hoàn toàn hơn 550 dòng code cào web phức tạp (Chuối Chiên, Gà Vàng, Xôi Lạc, Cà Khịa, StreamFree) khỏi ứng dụng trên TV.
            - App chuyển sang tải trực tiếp file `thethao.m3u` (do máy chủ Armbian tự động đẩy lên GitHub), tốc độ tải chỉ mất 0.2 - 0.3 giây.
            - Tiết kiệm tối đa bộ nhớ RAM và CPU cho TV Box (đặc biệt là Mi Box 3c 1GB RAM), không còn lo bị nhà mạng chặn DPI hay Cloudflare WAF trên TV.
          - **Tự động phân nhóm và ánh xạ danh mục thể thao thông minh:**
            - `⚽ TRỰC TIẾP BÓNG ĐÁ (HÔM NAY)`: Danh mục tổng hợp toàn bộ các trận đấu trong ngày kèm nút cập nhật nhanh ở dòng đầu.
            - `🌐 THỂ THAO QUỐC TẾ (F1 / TENNIS)`: Kênh thể thao quốc tế 24/7 (F1, Tennis, Canal+, Eurosport...).
            - Các danh mục theo nguồn: `🍌 Chuối Chiên TV`, `🐔 Gà Vàng / Tiếu Lâm`, `🌶️ Cà Khịa TV`...
          - **Bộ nhớ đệm thông minh:**
            - Tự động lưu cache offline trên TV, đảm bảo khi mất kết nối mạng vẫn phát kênh bình thường từ bộ nhớ đệm.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
