name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.14 - Khắc phục đen màn hình, Phục hồi giải mã phần cứng MediaCodec & Giữ OSD chuẩn xác"
        body: |
          ### Bản cập nhật v1.9.14 cho TV Play Android TV:
          - **Khắc phục triệt để lỗi đen màn hình / "Đang tải luồng...":**
            - Gỡ bỏ hoàn toàn bộ lọc phần mềm CPU `--video-filter=deinterlace` và `--avcodec-deinterlace=1` vốn gây xung đột với bộ giải mã phần cứng MediaCodec NDK (Direct Surface).
            - Khôi phục pipeline giải mã phần cứng nguyên bản siêu mượt, tải kênh tức thì sau 0.5s không bị treo.
          - **Bảo toàn đầy đủ tính năng nhận diện OSD thông minh:**
            - Nhận diện độ phân giải tức thì cho mọi luồng (UDP multicast, HTTP udpxy, HLS) mà không bao giờ bị kẹt ở "Đang nhận diện video...".
            - Tần số quét hiển thị chuẩn xác `@ 25fps` cho các kênh truyền hình 1080i (VTV, HTV...) chuẩn như trên PC.
            - Đo bitrate thời gian thực qua TrafficStats của Linux Kernel.
            - Bố cục OSD góc dưới 3 dòng rõ ràng: Tên kênh/Logo, EPG đang phát (màu cam), và Thông số kỹ thuật (màu cyan).
            - Khóa tiêu điểm D-pad không mất focus, máy chủ udpxy không bị bàn phím che khuất.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
