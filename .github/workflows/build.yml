name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Nút Cập Nhật Thể Thao & Sửa Lỗi EPG Trực Tiếp"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tối ưu cơ chế cập nhật thể thao & Bổ sung nút làm mới:**
            - Bổ sung nút bấm `"🔄 Cập nhật trận đấu (Bấm OK để tải lại)"` ở dòng đầu tiên của danh mục `⚽ TRỰC TIẾP BÓNG ĐÁ (HÔM NAY)`.
            - Giảm tần suất tự động quét trận đấu từ 3 phút xuống **15 phút một lần**, triệt tiêu request dồn dập khi chuyển đổi danh mục trong menu.
            - Tự động chạy tác vụ ngầm làm mới trận đấu và tỉ số định kỳ mỗi 15 phút.
          - **Sửa triệt để lỗi hiển thị EPG cho các trận đấu trực tiếp:**
            - Thay thế hoàn toàn EPG truyền hình sai lệch (trước đây hiện nhầm chương trình thời sự/phim truyện) bằng **Lịch thi đấu chuyên biệt cho từng trận**.
            - Hiển thị chính xác thời gian thi đấu thực tế, giờ bóng lăn, tên 2 đội, bình luận viên (BLV) và kênh tiếp sóng cả ở Spotlight bên phải và banner dưới góc trái.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
