name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.2' }}
        name: v1.9.2 - Tương thích nguồn Playlist Di động & Bóc tách M3U
        body: |
          ### Bản cập nhật v1.9.2 cho TV Play Android TV:
          - **Tương thích nguồn Playlist Di động:** Chuyển đổi User-Agent mặc định sang Mobile Android Chrome & iOS Safari kèm bộ Header di động đầy đủ (sec-ch-ua-mobile, Accept stream), giúp tải mượt mà các link M3U được bảo vệ hoặc chỉ trả dữ liệu cho trình duyệt điện thoại (như Cloudflare Pages `thtt.pages.dev/ttt.m3u`).
          - **Cơ chế xoay vòng User-Agent tự động:** Tự động thử qua nhiều danh tính (Mobile Chrome, Safari, VLC, TiviMate, Desktop) nếu server chặn hoặc trả về trang web mẫu.
          - **Tự động bóc tách link M3U nhúng trong HTML:** Nhận diện và tự động chuyển hướng theo các thẻ meta refresh, thẻ `<a href="...m3u">` hoặc mã M3U nhúng trong trang web.
          - **Bộ nhớ Cookie tự động (CookieJar):** Duy trì cookie phiên qua các lần redirect để vượt qua trang xác thực.
          - **Bao gồm các cải tiến trước:** Giao diện EPG toàn màn hình mượt mà, bấm OK trên EPG để phát, logo TV viền cam, thẻ dài Android TV, chuẩn FHD 1080 và thẻ OSD 10s khi Back.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
