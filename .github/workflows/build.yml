name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Tích hợp nguồn Thể Thao Quốc Tế StreamFree (Bóng đá, F1, Quần vợt, Bóng rổ)"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tích hợp nguồn thể thao quốc tế StreamFree:**
            - Bổ sung chuyên mục `🌐 StreamFree (Quốc Tế)` với các bộ môn chọn lọc: ⚽ Bóng đá (`soccer`), 🏎️ Đua xe F1 (`racing`), 🎾 Quần vợt (`tennis`), 🏀 Bóng rổ (`basketball`).
            - Tự động gộp các trận bóng đá quốc tế hấp dẫn vào chuyên mục `⚽ TRỰC TIẾP BÓNG ĐÁ (HÔM NAY)`.
            - Cơ chế tự động giải mã luồng `.m3u8` trực tiếp từ ByteDance Global CDN kèm token chữ ký số động thời hạn 8 tiếng.
          - **Tối ưu hóa kết nối & User-Agent:**
            - Thống nhất User-Agent Chrome Desktop chuẩn tránh bị Cloudflare WAF chặn kết nối.
          - **Kho thể thao trực tiếp đầy đủ 6 chuyên mục ghim cố định:**
            - `⚽ TRỰC TIẾP BÓNG ĐÁ (HÔM NAY)` (kèm nút 🔄 Cập nhật trận đấu)
            - `🌐 StreamFree (Quốc Tế)`
            - `🍌 Chuối Chiên TV`
            - `🐔 Gà Vàng / Tiếu Lâm`
            - `🍚 Xôi Lạc TV`
            - `🌶️ Cà Khịa TV`
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
