name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.10' }}
        name: v1.9.10 - Triệt Tiêu Lỗi Mất Focus D-pad Khi Cuộn Nhanh, Tối Ưu Vị Trí Nhập Liệu UDPxy
        body: |
          ### Bản cập nhật v1.9.10 cho TV Play Android TV:
          - **Triệt tiêu hoàn toàn lỗi mất/văng D-pad khi cuộn nhanh danh sách kênh:**
            - Bổ sung `TvLinearLayoutManager` cho Android TV: Can thiệp `onInterceptFocusSearch()`, tự động pre-scroll đến kênh tiếp theo và khóa tiêu điểm (`trap focus`), tuyệt đối không để Android hủy focus hoặc văng ra ngoài.
            - Lưới an toàn `ChildAttachStateChangeListener`: Tự động bắt lại và trao focus cho item hiển thị gần nhất nếu item có focus bị detach/recycle khi lướt nhanh.
            - Tạm dừng tải ảnh Glide (`pauseRequests`) trong lúc lướt nhanh danh sách để giải phóng 100% CPU duy trì khung hình 60fps mượt mà, không giật lag.
            - Đặt `android:focusable="false"` cho container RecyclerView để tránh focus bị rơi vào khung nền rỗng.
          - **Tối ưu vị trí nhập liệu Máy chủ udpxy trong Cài đặt:**
            - Chuyển mục Máy chủ udpxy lên vị trí số 2 (ngay đầu cột bên phải), nằm trọn vẹn ở nửa trên màn hình TV, hoàn toàn không bị bàn phím ảo che khuất khi nhập liệu.
            - Điều hướng D-pad thông minh: Sang Phải từ ô tên M3U nhảy thẳng vào udpxy, phím Xuống nhảy xuống LibVLC.
          - **Kế thừa toàn bộ tối ưu ổn định từ v1.9.9:**
            - Khởi động an toàn, chống văng app LibVLC `already attached`.
            - Lịch phát sóng EPG hiển thị duy nhất 1 mục Đang Phát chuẩn xác theo thời gian thực.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
