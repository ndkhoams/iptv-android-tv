name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.13 - Nhận diện độ phân giải luồng UDP/HTTP & Khử xé hình 1080i (Blend Deinterlace 25fps)"
        body: |
          ### Bản cập nhật v1.9.13 cho TV Play Android TV:
          - **Nhận diện siêu tốc độ phân giải luồng UDP Multicast & HTTP UDPXY:**
            - Khắc phục triệt để tình trạng luồng UDP/HTTP bị kẹt ở "Đang nhận diện video...".
            - Tự động nhận diện tức thì kích thước pixel thực (`1920x1080`, `1280x720`, `720x576`) cho các luồng raw MPEG-TS không có manifest tĩnh.
          - **Khử xé hình ngang (Deinterlace Blend - Gộp 2 frame thành 1):**
            - Luồng IPTV FPT phát chuẩn 1080i50 (50 fields/s xen kẽ).
            - Kích hoạt chuẩn thuật toán `:video-filter=deinterlace`, `:deinterlace=1`, `:deinterlace-mode=blend`, và `:avcodec-deinterlace=1`.
            - Gộp 2 trường quét so le thành 1 khung hình đầy đủ progressive, triệt tiêu 100% hiện tượng xé hình / răng cưa khi có chuyển động.
            - Hiển thị tần số quét thực tế sau deinterlace: `1920x1080 @ 25fps` chuẩn mượt mà như xem trên PC.
          - **Kế thừa các tính năng nổi bật từ v1.9.12:**
            - Đo bitrate thời gian thực qua TrafficStats của Linux Kernel.
            - Bố cục OSD góc dưới 3 dòng rõ ràng: Tên kênh/Logo, EPG đang phát (màu cam), và Thông số kỹ thuật (màu cyan).
            - Khóa tiêu điểm D-pad không mất focus, máy chủ udpxy không bị bàn phím che khuất.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
