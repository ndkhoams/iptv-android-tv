name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Tối Ưu Tải Luồng & Kênh Đầu Tiên KTV.m3u Mặc Định"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tối ưu trải nghiệm tải luồng (Buffering UI):**
            - Triệt tiêu hoàn toàn thông báo xoay vòng "Đang tải luồng..." ở giữa màn hình khi đang phát video.
            - Chuyển vòng xoay tải luồng tinh tế sang cuối bên phải thẻ tên kênh ở góc trái màn hình khi chuyển/mở kênh mới.
            - Tối ưu bộ nhớ đệm VLC lên 1.5s, loại bỏ hiện tượng giật lag và chống tải luồng vi mô liên tục.
          - **Mặc định kênh khởi động:**
            - Luôn tự động mở kênh đầu tiên của danh sách `KTV.m3u` mỗi khi ứng dụng khởi động.
            - Đồng bộ thiết lập chế độ kênh khởi động giữa TV và giao diện quản lý Web.
          - **Kho Thể Thao & KTV Playlist:**
            - TV Play Pro chuyên biệt trực tiếp thể thao (Chuối Chiên, Gà Vàng, Tiếu Lâm, Xôi Lạc, Cà Khịa, Sự kiện TV360, VTVPrime, Sky Sports...).
            - Duy nhất playlist online mặc định KTV.m3u.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
