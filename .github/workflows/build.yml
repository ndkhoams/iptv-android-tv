name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.18 - Tích hợp 560+ Kênh TV Play Pro mặc định & Sửa lỗi Sao lưu trên Android 10+"
        body: |
          ### Bản cập nhật v1.9.18 cho TV Play Android TV:
          - **Tích hợp kho 560+ Kênh TV Play Pro làm mặc định:**
            - Nhúng sẵn danh sách 564 kênh chất lượng cao (`builtin_playlist.m3u`) từ kho GetOut trực tiếp vào Assets của ứng dụng. Tốc độ nạp kênh tức thì, không bị lỗi mạng làm gián đoạn.
            - Đầy đủ các nhóm: VTV, Thể Thao Quốc Tế (Sky Sports, Canal+ Sport, TNT Sports), FIFA World Cup, VTVCab (ON Sports, ON Football, ON Cine...), SCTV (1 đến 22), HTV, Phim Truyện, Sự Kiện, Địa Phương và Radio.
            - Hỗ trợ scheme `asset://` trong `PlaylistManager`.
            - Cung cấp sẵn bộ 3 danh sách kênh: `TV Play Pro (560+ Kênh)`, `FPT IPTV`, `Thể Thao Quốc Tế (VMT)` dễ dàng chuyển đổi 1 click qua phím Danh Sách trên Remote hoặc qua giao diện Web.
            - Tích hợp `GetOutManager`: Tự động bắt domain động từ GitHub và giải mã Master Key AES-256-CBC.
          - **Sửa dứt điểm lỗi "Lỗi khi sao lưu dữ liệu!" trên Android 10+:**
            - Cơ chế sao lưu 3 tầng an toàn: Nội bộ ứng dụng (100% không cần quyền) + Bộ nhớ ngoài chuyên biệt của app + Thư mục Download công cộng qua MediaStore API (vượt qua rào cản Scoped Storage trên Android 10, 11, 12, 13, 14).
            - Cho phép chọn file `.json` khi Khôi phục trong `LocalFilePickerDialog` kèm icon phân biệt `⚙ [Sao lưu]`.
            - Khai báo bổ sung quyền `MANAGE_EXTERNAL_STORAGE` và mở rộng `WRITE_EXTERNAL_STORAGE` cho Android TV.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
