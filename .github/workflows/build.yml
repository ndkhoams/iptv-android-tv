name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.8' }}
        name: v1.9.8 - Sửa Lỗi Đen Màn Hình VLC, Bàn Phím Ảo udpxy & Hiển Thị Đang Phát EPG
        body: |
          ### Bản cập nhật v1.9.8 cho TV Play Android TV:
          - **Khắc phục triệt để hiện tượng đen màn hình nhưng vẫn có tiếng:**
            - Quản lý chuẩn xác vòng đời bề mặt vẽ LibVLC: Gọi `attachViews()` trong `onStart()`, giải phóng an toàn `detachViews()` trong `onStop()`.
            - Khi mở lại ứng dụng từ màn hình Home hoặc chế độ nghỉ màn hình, hình ảnh được vẽ lại tức thì mà không bị mất surface.
            - Hỗ trợ giải mã fallback linh hoạt `setHWDecoderEnabled(true, false)` và đảm bảo cửa sổ đo đạc hoàn tất trước khi phát kênh khởi động.
          - **Sửa lỗi không bật được bàn phím ảo khi nhập máy chủ udpxy:**
            - Bổ sung `android:inputType="text"` và bắt sự kiện phím giữa (DPAD_CENTER / ENTER / Click) để tự động gọi bàn phím ảo TV hiện lên ngay lập tức.
            - Tự động ẩn bàn phím và chuyển tiêu điểm xuống nút "Sao Lưu" khi bấm Hoàn tất (Done).
          - **Sửa lỗi hiển thị trùng lặp nhiều huy hiệu "Đang phát" trên Lịch phát sóng (EPG):**
            - Khóa duy nhất 1 chương trình thực tế đang phát trên dòng thời gian, ngăn chặn hoàn toàn việc hiện nhiều nhãn `[ĐANG PHÁT]` cùng lúc do nhà đài lệch giờ.
            - Tự động lọc bỏ các chương trình cũ đã kết thúc quá 1 giờ trong quá khứ và loại bỏ trùng lặp thời gian.
          - **Bao gồm toàn bộ nâng cấp từ v1.9.7:** Khắc phục kẹt phím D-pad, Web Remote Kênh yêu thích, Thẻ Logo phong cách Dark Navy tối giản.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
