name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Tích Hợp WebView Stream Sniffer & Quản Lý Playlist Web Remote Tức Thì"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Tích hợp cơ chế WebView Stream Sniffer trực tiếp trong ứng dụng:**
            - Bóc tách luồng trực tiếp `.m3u8` ngầm từ các trang nhúng thể thao quốc tế (PPV.st, Embed.st, StreamFree, Xôi Lạc / Cà Khịa...) cùng đầy đủ Header bản quyền Referer và Origin.
            - Tự động ngắt nạp segment video trong WebView, chuyển luồng sạch cho ExoPlayer / VLC giải mã phần cứng 1080p mượt mà, không tốn RAM TV Box.
          - **Bổ sung nhóm kênh Thể Thao Quốc Tế Web Sniffer:**
            - Sky Sports F1 HD, Sky Sports Tennis HD, TNT Sports 1-2 HD, Eurosport 1 HD, beIN Sports 1 English, Premier League TV HD...
          - **Nâng cấp Web Remote (port 8080) tức thì (0s delay):**
            - Thêm link M3U mới hoặc tải file M3U từ điện thoại lên TV xuất hiện ngay lập tức nhờ triệt tiêu HTTP browser cache và cập nhật tự động.
            - Thêm tùy chọn "Kích hoạt phát danh sách này ngay trên TV" khi thêm/upload playlist.
          - **Khắc phục triệt để lỗi KTV Playlist bị fix cứng:**
            - Người dùng hoàn toàn có thể xóa KTV Playlist vĩnh viễn mà không bao giờ bị app tự động tạo lại.
            - Tự do quản lý và lưu giữ bất kỳ playlist nào bạn muốn.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
