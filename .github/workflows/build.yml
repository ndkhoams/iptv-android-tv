name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Chuyên Biệt Trực Tiếp Thể Thao & Duy Nhất KTV Playlist"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Chuyên biệt hoá TV Play Pro thành kho Trực Tiếp Thể Thao:**
            - Loại bỏ toàn bộ các kênh truyền hình TV thường khỏi list TV Play Pro để tránh trùng lặp.
            - Chỉ giữ lại các mục trực tiếp thể thao đỉnh cao: FIFA World Cup 2026, Thể Thao Quốc Tế (Sky Sports, Canal+ Live 1-12, TNT Sports 1-4, Eurosport, MUTV), Sự Kiện TV360, Sự Kiện VTVPrime.
            - Tích hợp tự động 5 nguồn thể thao trực tiếp theo thời gian thực: 🍌 Chuối Chiên TV (kèm BLV & FHD/HD), 🐔 Gà Vàng & Tiếu Lâm, 🍚 Xôi Lạc TV, 🌶️ Cà Khịa TV.
          - **Duy nhất Playlist M3U mặc định KTV Playlist:**
            - Chỉ giữ lại duy nhất đường link playlist trực tuyến: `https://raw.githubusercontent.com/ndkhoams/iptv/refs/heads/main/ktv.m3u`.
            - Tự động làm sạch các nguồn M3U cũ (FPT, VMT).
            - Mặc định để trống máy chủ UDPXY.
          - **Player Engine hoàn thiện:**
            - Hỗ trợ đầy đủ Referer và User-Agent cho cả LibVLC và ExoPlayer, phát mượt mọi luồng trực tiếp không bị chặn 403.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
