name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Sửa Lỗi Web Remote Tải Playlist & Loại Bỏ WebView Sniffer"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Sửa triệt để lỗi 'Lỗi tải danh sách playlist' trên Web Remote:**
            - Xử lý bóc tách query parameter `?t=...` trong router HTTP `TvWebServer`, giúp các endpoint `/api/playlists`, `/api/channels`, `/api/status`, `/api/settings` phản hồi tức thì 100% không bị 404 Not Found.
            - Giao diện Web Remote quản lý và hiển thị danh sách playlist đã lưu ngay sau khi thêm hoặc tải file lên mà không cần reload trang.
          - **Loại bỏ hoàn toàn tính năng WebView Stream Sniffer khỏi ứng dụng:**
            - Gỡ bỏ toàn bộ engine WebView ngầm và logic sniffer theo yêu cầu người dùng, giúp ứng dụng siêu nhẹ, tối ưu RAM và CPU trên mọi dòng Android TV Box.
            - Khôi phục luồng phát ổn định trực tiếp qua ExoPlayer và VLC Player.
          - **Duy trì nhóm Kênh Thể Thao Quốc Tế 24/7 trực tiếp:**
            - Sky Sport F1 HD, Sky Sport Tennis HD, TNT Sports 1-4 HD, Eurosport 1-2 HD, Canal+ Sport HD chạy mượt mà trên hạ tầng phát sóng ổn định.
          - **Quản lý danh sách Playlist tự do:**
            - Người dùng có thể tùy ý xóa bỏ KTV Playlist hoặc bất kỳ danh sách nào mà không bị app tự động phục hồi.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
