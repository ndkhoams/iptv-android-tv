name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Duy Nhất KTV Playlist & Ghim Kho Thể Thao Trực Tiếp"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Loại bỏ hoàn toàn TV Play Pro:**
            - Xóa bỏ triệt để playlist `TV Play Pro (Thể Thao)` khỏi danh sách nguồn M3U và cấu hình lưu trữ.
            - Triệt tiêu toàn bộ các kênh và danh mục thừa cũ (Tất cả, FIFA World Cup, Thể thao quốc tế, Sự kiện TV360, Sự kiện VTVPrime).
          - **Duy nhất 1 Playlist mặc định KTV.m3u:**
            - Chỉ giữ lại duy nhất 1 danh sách kênh trực tuyến là `KTV Playlist` (`https://raw.githubusercontent.com/ndkhoams/iptv/refs/heads/main/ktv.m3u`).
          - **5 chuyên mục trực tiếp thể thao ghim cố định ở đầu:**
            - `⚽ TRỰC TIẾP BÓNG ĐÁ (HÔM NAY)` (kèm nút 🔄 Cập nhật trận đấu)
            - `🍌 Chuối Chiên TV`
            - `🐔 Gà Vàng / Tiếu Lâm`
            - `🍚 Xôi Lạc TV`
            - `🌶️ Cà Khịa TV`
          - **Sửa triệt để lỗi hiển thị EPG:**
            - Lịch thi đấu chuyên biệt thời gian thực cho từng trận đấu thay thế hoàn toàn EPG kênh TV thông thường.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
