name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Push Full Compile Log if Failed
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git checkout -B build-error-log
        find . -name "*.log" -o -name "hs_err*" -o -name "*.txt" | head -n 30 > error_report.txt
        ./gradlew assembleDebug -Pkotlin.daemon.jvm.options="-XX:+PrintCommandLineFlags" 2>&1 | grep -C 3 "e: " >> error_report.txt || true
        git add error_report.txt
        git commit -m "Capture compiler error report"
        git push origin build-error-log --force

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk
