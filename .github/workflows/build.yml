name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.17 - Gán phím Menu Remote, Mặc định User-Agent FPT Play Box & Đồng bộ 100% Cài đặt lên Web"
        body: |
          ### Bản cập nhật v1.9.17 cho TV Play Android TV:
          - **Gán phím tắt mở Cài Đặt vào nút Menu trên remote:**
            - Bắt phím ở tầng sự kiện cao nhất `dispatchKeyEvent`: Bấm nút Menu ☰ hoặc Settings ⚙️ trên remote là mở ngay bảng Cài đặt bất kể đang xem toàn màn hình hay đang chọn kênh.
            - Bấm lại phím Menu lần nữa để Tự động Lưu và Đóng cài đặt nhanh chóng.
          - **Thiết lập mặc định HTTP User-Agent FPT Play Box chuẩn IPTV:**
            - Chuỗi định danh: `Mozilla/5.0 (Linux; Android 12; ZTE B866V2F Build/STTC.230104.002) IPTV/9.1.16`.
            - Giúp ứng dụng nhận diện chuẩn xác như box chính hãng của đài, mở khóa toàn bộ luồng phát và vượt rào chặn kênh.
            - Bổ sung ô tùy chỉnh User-Agent trên cả TV và Web kèm nút "Khôi phục mặc định".
          - **Đồng bộ 100% Cài đặt lên giao diện Web Remote (`http://[IP_TV]:8080`):**
            - Tab Cài Đặt trên Web nay có đầy đủ: Bộ giải mã (LibVLC / ExoPlayer), Khử răng cưa 1080i (Yadif, Linear, Blend, Tắt), HTTP User-Agent, UDPXY, Khởi động cùng TV.
            - Cập nhật thời gian thực: Khi thay đổi bộ giải mã hay khử xé hình trên điện thoại/máy tính, TV lập tức áp dụng và chuyển đổi mượt mà.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
