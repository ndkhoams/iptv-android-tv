name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi
        cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/TV Play.apk"
        for f in remote/build/outputs/apk/debug/*.apk; do
          if [ -f "$f" ]; then
            cp "$f" "remote/build/outputs/apk/debug/TV Remote.apk"
            break
          fi
        done

    - name: Upload TV Play APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Play-debug
        path: "app/build/outputs/apk/debug/TV Play.apk"

    - name: Upload TV Remote APK Artifact
      if: hashFiles('remote/build/outputs/apk/debug/TV Remote.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: TV-Remote-debug
        path: "remote/build/outputs/apk/debug/TV Remote.apk"

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - TV Play & TV Remote"
        body: |
          ### Bản cập nhật ${{ github.ref_name }}:
          - Cập nhật giao diện mới cho app TV Remote (v1.1.0):
            + Header: Cài đặt (bánh răng bên trái), Chấm trạng thái kết nối + tên TV ở giữa, Nút Nguồn đỏ ở góc phải.
            + Hàng phím Media 5 nút tròn: Tua lùi bài trước, Tua lùi, Phát/Tạm dừng, Tua tới, Bài kế tiếp.
            + Cụm điều hướng trung tâm D-Pad tròn lớn & phím OK chính giữa.
            + Cụm phím âm lượng VOL dạng con nhộng dọc (+ / -).
            + Cụm phím chuyển kênh CH dạng con nhộng dọc (∧ / ∨).
            + Lưới 6 phím tròn ở giữa: Bàn phím gõ chữ (Keyboard), Home, Bàn phím số Numpad (0-9), Tắt tiếng (Mute), Nút Nói Micro tiếng Việt, Quay lại (Back).
          - Ứng dụng TV Play Android TV (v2.1.39).
        files: |
          app/build/outputs/apk/debug/TV Play.apk
          remote/build/outputs/apk/debug/TV Remote.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
