name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.3' }}
        name: v1.9.3 - Sao Lưu Cấu Hình, Khắc Phục Cài Đè APK & Tối Ưu EPG
        body: |
          ### Bản cập nhật v1.9.3 cho TV Play Android TV:
          - **Khắc phục lỗi không cài đè được APK:** Đóng gói chữ ký số cố định vĩnh viễn (RSA 2048-bit, thời hạn 27 năm), giải quyết triệt để lỗi xung đột chữ ký ngẫu nhiên của máy ảo GitHub Actions. Từ bản này trở đi, người dùng luôn có thể cài đè trực tiếp cập nhật trên TV Box mà không cần gỡ ứng dụng và giữ nguyên toàn bộ cấu hình.
          - **Tính năng Sao Lưu & Khôi Phục Cấu Hình (Backup & Restore):** Hỗ trợ xuất và nạp lại toàn bộ danh sách M3U, kênh yêu thích, server udpxy và cài đặt hệ thống ra/vào file `tvplay_backup.json` qua cả menu TV và Web Remote (`:8080`). Tự động sao lưu dự phòng kép (Auto-Backup Mirror) và tự động nhận diện khôi phục khi cài lại.
          - **Sửa triệt để lỗi đè chữ ở Lịch phát sóng (EPG):** Giới hạn viewport RecyclerView chuẩn xác, loại bỏ lỗi tràn biên đồ họa làm chữ chương trình đè lên tiêu đề EPG và footer udpxy.
          - **Ưu tiên danh tính TiviMate & OTT Navigator:** Mặc định gửi danh tính TiviMate và OTT Navigator khi tải playlist để tương thích hoàn hảo với các nguồn IPTV có bảo vệ, kèm cơ chế Multi-UA fallback tự động.
          - **Chuẩn hóa link mặc định:** Đổi link mặc định thành `https://121124.xyz/tv/fpt`, tự động xử lý và gắn cổng udpxy theo máy chủ người dùng đã cấu hình.
          - **Xuất / Tải Playlist chuẩn TiviMate & OTT Navigator:** Bổ sung nút tải file `.m3u` và endpoint trực tiếp `http://[IP]:8080/playlist.m3u` trên Web Remote.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
