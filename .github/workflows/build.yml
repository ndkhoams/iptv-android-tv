name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        tag_name: ${{ github.ref_name }}
        name: "${{ github.ref_name }} - Tối Ưu Quét Thể Thao 30 Phút, Chống Đè Thông Báo & Tối Ưu Cho Android 5.1 (Mi Box 3c)"
        body: |
          ### Bản cập nhật ${{ github.ref_name }} cho TV Play Android TV:
          - **Điều chỉnh chu kỳ cào luồng thể thao ngầm:**
            - Nâng thời gian quét và cập nhật danh sách trực tiếp thể thao lên **30 phút một lần** (thay vì 15 phút), giảm tải mạng và giữ cho TV Box chạy mượt mà, tiết kiệm tài nguyên.
          - **Khắc phục triệt để lỗi đè thông báo:**
            - Sửa hiện tượng thanh thông báo thoát đè lên bảng thông tin kênh nhanh OSD. Bổ sung cơ chế tự động ẩn bảng cũ khi bảng mới xuất hiện.
          - **Tối ưu hóa chuyên sâu cho thiết bị Android 5.1 / RAM 1GB (Mi Box 3c):**
            - Bật `largeHeap="true"` mở rộng bộ nhớ Java Heap lên 256MB–512MB, chống tràn RAM (`OutOfMemoryError`) khi nạp danh sách kênh lớn.
            - Bật `hardwareAccelerated="true"` ép GPU Mali-450 gánh toàn bộ giao diện 60fps.
            - Hỗ trợ SSL / TLS Permissive cho Android 5.1, bỏ qua lỗi chứng chỉ Let's Encrypt hết hạn trên hệ điều hành Android cũ khi tải playlist online.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
