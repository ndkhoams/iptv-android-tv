name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.1' }}
        name: v1.9.1 - Tối ưu toàn màn hình EPG & Bỏ các nút thừa điều hướng
        body: |
          ### Bản cập nhật v1.9.1 cho TV Play Android TV:
          - **Tối ưu hiển thị EPG toàn diện:** Loại bỏ 3 nút thừa bên dưới lịch phát sóng (Phát kênh, Yêu thích, Mặc định), giải phóng 100% không gian chiều cao để hiển thị thêm nhiều chương trình trong ngày.
          - **Điều hướng Remote mượt mà:** Khắc phục triệt để lỗi bị mắc kẹt khi cuộn lịch phát sóng; cuộn lên / xuống thoải mái từ đầu đến cuối ngày không bị cản trở.
          - **Tích hợp thao tác trực tiếp trên EPG:** Bấm OK vào bất kỳ chương trình nào trong danh sách EPG để phát ngay kênh đó; nhấn giữ OK để mở Menu tác vụ (Yêu thích, Đặt kênh mặc định khởi động, v.v.).
          - **Bao gồm các cải tiến v1.9.0:** Logo TV viền cam mới, Banner Android TV Leanback thẻ dài, sửa tương phản danh sách phát nhanh, chuẩn FHD 1080 và thẻ thông tin kênh 10s khi Back.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
