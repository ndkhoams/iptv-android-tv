name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "v1.9.15 - Nâng cấp Deinterlace Yadif PC (Khử xé hình & nét mịn), Tùy chỉnh bộ lọc & Gỡ drop-frames"
        body: |
          ### Bản cập nhật v1.9.15 cho TV Play Android TV:
          - **Nâng cấp thuật toán Deinterlace chuẩn Yadif (Yet Another Deinterlacing Filter):**
            - Thuật toán khử xen kẽ tiêu chuẩn vàng trên PC VLC: kết hợp nội suy không gian và thời gian theo hướng cạnh của hình ảnh.
            - Vùng tĩnh giữ trọn $100\%$ độ sắc nét 1080p, vùng chuyển động được khử răng cưa mượt mà không còn hiện tượng bóng ma (ghosting), sọc ngang hay noise hạt như thuật toán Blend trước đây.
          - **Loại bỏ `--skip-frames` và `--drop-late-frames`:**
            - Đảm bảo bộ giải mã phần cứng MediaCodec giải mã nguyên vẹn $100\%$ từng trường quét (field) và khung hình, triệt tiêu hiện tượng vỡ khối nén macroblock và nhiễu viền.
          - **Bổ sung tùy chọn Deinterlace ngay trong Menu Cài đặt (Phần 3):**
            - Dễ dàng bấm phím Menu để chọn giữa các chế độ:
              + **Yadif (Mặc định - Khuyên dùng):** Cực kỳ sắc nét và mịn màng như xem trên PC.
              + **Linear:** Nội suy tuyến tính, mượt mà và nhẹ máy cho TV Box cấu hình yếu.
              + **Blend:** Gộp 2 trường quét (chế độ cơ bản).
              + **Tắt Deinterlace:** Giữ nguyên luồng gốc cho các kênh progressive.
          - **Kế thừa toàn bộ tính năng vượt trội từ các bản trước:**
            - OSD 3 dòng thông minh góc dưới màn hình: Tên kênh/Logo, Lịch phát sóng EPG (màu cam), và Thông số kỹ thuật độ phân giải @ FPS thực tế, Bitrate thực và Audio (màu cyan).
            - Không bao giờ bị kẹt ở "Đang nhận diện video...", tải luồng siêu tốc 0.5s không bị đen màn hình.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
