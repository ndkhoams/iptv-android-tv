name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.11' }}
        name: v1.9.11 - Đo Bitrate Thực Tế Thời Gian Thực, Tái Cấu Trúc Bố Cục Thẻ OSD Góc Dưới
        body: |
          ### Bản cập nhật v1.9.11 cho TV Play Android TV:
          - **Đo lường Bitrate thực tế thời gian thực qua Kernel Linux TrafficStats:**
            - Chấm dứt triệt để tình trạng mọi video đều hiện cố định 8.0 Mbps.
            - Đo đạc chính xác lưu lượng byte mạng tức thời (TrafficStats & LibVLC Stats), áp dụng thuật toán làm mượt (EMA) giúp con số hiển thị chính xác theo từng kênh (từ 1.8 Mbps SD, 3-5 Mbps HD đến 8-15 Mbps FHD/4K).
            - Bộ đếm chỉ chạy khi hiển thị banner OSD/Overlay để tiết kiệm 100% tài nguyên CPU khi xem toàn màn hình.
          - **Tái cấu trúc bố cục 3 dòng thẻ OSD thông tin nhanh góc dưới:**
            - **Dòng 1:** Số thứ tự kênh + Logo kênh + Tên kênh (Ví dụ: `01 [Logo] VTV1 (HD 8Mbps)`).
            - **Dòng 2 (Màu cam):** Lịch phát sóng EPG thời gian thực (`● Đang phát: Bản tin Thời sự (20:00 - 21:00)`).
            - **Dòng 3 (Màu xanh Cyan):** Kích thước độ phân giải @ FPS • Bitrate đo thực tế • Thông tin Audio chi tiết (`1920x1080 @ 50fps • 8.4 Mbps • AAC Stereo 2.0 (48kHz)`).
          - **Kế thừa toàn bộ tối ưu mượt mà từ v1.9.10:**
            - Khóa tiêu điểm D-pad bằng `TvLinearLayoutManager`, cuộn nhanh không bao giờ mất focus.
            - Máy chủ udpxy ở mục số 2 đầu trang không bị bàn phím che khuất.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
