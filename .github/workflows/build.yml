name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.4' }}
        name: v1.9.4 - Khử Sạch Sọc Ngang 1080i (Yadif & Software FFmpeg), Đo FPS/Bitrate & Sửa D-pad Cài Đặt
        body: |
          ### Bản cập nhật v1.9.4 cho TV Play Android TV:
          - **Khử triệt để sọc ngang/răng cưa 1080i (Deinterlacing):**
            - Tắt Direct Rendering (`:no-mediacodec-dr`, `:no-omxil-dr`) để buộc khung hình đi qua bộ lọc video của VLC.
            - Nâng cấp thuật toán Deinterlace sang **Yadif** (thuật toán khử xen kẽ cao cấp nhất, nội suy chuyển động mượt mà, không bóng mờ).
          - **Bổ sung chế độ "LibVLC Phần Mềm (FFmpeg Yadif)":**
            - Tùy chọn chạy 100% giải mã phần mềm FFmpeg C++ (`:avcodec-hw=none`), miễn nhiễm hoàn toàn với lỗi chip phần cứng MediaCodec trên các dòng Box cũ, triệt tiêu 100% sọc ngang quét mành.
          - **Hiển thị thông số luồng thời gian thực trên thẻ OSD góc dưới:**
            - Đo và cập nhật trực tiếp độ phân giải thực, tần số quét (FPS), bitrate đo được của luồng stream.
            - Hiển thị chi tiết âm thanh: Codec (AAC, AC3, EAC3...), cấu hình kênh (Stereo 2.0, 5.1 Surround), tần số lấy mẫu (48kHz).
          - **Sửa lỗi D-pad cài đặt:** Bổ sung ScrollView tự động cuộn màn hình và điều hướng liên kết tiêu điểm 2 chiều chuẩn xác cho remote, dễ dàng di chuyển xuống Mục 5 (Sao lưu & Khôi phục).
          - **Tối ưu Web Remote:** Dọn dẹp giao diện quản lý playlist trên trang Web điều khiển từ xa.
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
