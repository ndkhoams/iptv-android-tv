name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        echo "==================== BUILD LOG START ===================="
        cat build_log.txt
        echo "==================== BUILD LOG END ======================"
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "FAIL: app-debug.apk was not generated"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidTV-IPTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.9.7' }}
        name: v1.9.7 - Khắc Phục Kẹt Phím D-Pad, Thêm Tab Yêu Thích Web Remote, Tối Ưu Bàn Phím Cài Đặt & Thẻ Logo Mới
        body: |
          ### Bản cập nhật v1.9.7 cho TV Play Android TV:
          - **Khắc phục triệt để hiện tượng kẹt phím D-Pad khi lướt kênh:**
            - Bổ sung cơ chế Debounce 120ms thông minh: Khi bấm hoặc giữ phím Lên/Xuống duyệt nhanh, ứng dụng chỉ cập nhật tên kênh tức thì (0ms) và hoãn các tác vụ nặng (tải logo, nạp lịch EPG) để giải phóng 100% tài nguyên CPU cho luồng giao diện chính.
            - Bổ sung `descendantFocusability="afterDescendants"` và triệt tiêu `itemAnimator` giúp chuyển focus mượt mà 60fps không bị giật khựng.
            - Thêm cơ chế tự động chuyển hướng tiêu điểm nếu khung RecyclerView container nhận focus ngoài ý muốn.
          - **Tối ưu hiển thị bàn phím ảo & điều hướng trong Cài đặt:**
            - Kích hoạt `SOFT_INPUT_ADJUST_RESIZE`: Tự động cuộn ô nhập Máy Chủ udpxy lên sát mép trên màn hình khi mở bàn phím ảo TV, giúp nhìn rõ từng ký tự đang gõ.
            - Sửa lỗi điều hướng D-Pad từ ô udpxy di chuyển xuống Mục 5 (Sao Lưu & Khôi Phục) mượt mà.
            - Gỡ bỏ tùy chọn "Tự động mở ứng dụng khi TV khởi động" theo yêu cầu.
            - Khắc phục lỗi trùng màu chữ trắng trên nền highlight trắng ở mục 1. Danh Sách M3U.
          - **Nâng cấp Web Remote (Điều khiển qua Điện Thoại & Máy Tính):**
            - Bổ sung thẻ **Kênh Yêu Thích** (★) chuyên biệt trên thanh điều hướng bên dưới, tích hợp thanh tìm kiếm riêng và hỗ trợ bấm phát kênh trực tiếp lên TV.
            - Đồng bộ trạng thái yêu thích thời gian thực giữa Web Remote và TV.
          - **Thiết kế lại Thẻ Banner Logo ứng dụng (Màn hình chính Launcher):**
            - Phong cách Dark Navy sang trọng, tối giản, đồng điệu tuyệt đối với các ứng dụng hiện đại trên Android TV (Stremio, Tailscale, Live Channels).
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
