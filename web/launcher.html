<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Play Launcher</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .logo-box {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            font-weight: 900;
            font-size: 24px;
            padding: 8px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.4);
            display: inline-block;
        }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fallback-link {
            color: #f97316;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(249, 115, 22, 0.3);
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .fallback-link:hover {
            background: #f97316;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="logo-box">TV PLAY</div>
    <div class="spinner"></div>
    <h2>Đang mở TV Play Web...</h2>
    <p id="txtStatus">Đang chuyển hướng tới phiên bản mới nhất trên GitHub...</p>
    <a id="btnManual" class="fallback-link" href="#">Bấm vào đây nếu không tự chuyển</a>

    <script>
        // Cấu hình URL đích (GitHub Pages)
        var TARGET_URL = "https://ndkhoams.github.io/iptv-android-tv/";

        document.getElementById('btnManual').href = TARGET_URL;

        // Chuyển hướng sau 800ms
        setTimeout(function() {
            window.location.replace(TARGET_URL);
        }, 800);
    </script>
</body>
</html>
